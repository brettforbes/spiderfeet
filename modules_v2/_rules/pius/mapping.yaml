tool: pius
capture_family: structured_native
seed_docs:
  - .seed/08_Rules_for_Pius.md
  - .seed/14_Business_Rules_for_Converting_Structured_Data_to_Graph.md
scan_head:
  data_path: scan_data
  fallback: pius scan
hooks:
  - apply_pius_records
topology_templates:
  - scan_head
mappings:
  - path: command
    nugget_id: SCAN_CLI
    relation: had
  - path: target
    nugget_id: SCAN_TARGET
    relation: had
  - path: org
    nugget_id: SCAN_TARGET_ORG
    relation: had
  - path: started_at
    nugget_id: SCAN_START
    relation: had
  - path: duration_s
    nugget_id: SCAN_ELAPSED
    relation: had
  - path: exit_code
    nugget_id: SCAN_EXIT_STATUS
    relation: had
