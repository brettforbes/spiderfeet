tool: pius
version: 4
default_runtime: wsl
default_timeout: 600
env_file: .tools/pius.env
binary_probe: wsl bash -lc "test -x /mnt/c/projects/spiderfeet/.tools/pius"
primary_parser: ndjson
output_path_type: 2

# NDJSON on stdout; harvest converts to JSON bundle + derived [type] value (source) text.
# stderr progress banners are stored in structured.stderr_banner only.
# Pair with --output terminal scenarios for native TUI capture.

scenarios:
  - id: crt_praetorian_ndjson
    name: "crt-sh rich domains (Praetorian)"
    org: Praetorian
    target: praetorian.com
    command: /mnt/c/projects/spiderfeet/.tools/pius run --org Praetorian --domain praetorian.com --plugins crt-sh --output ndjson
    structured_kind: json
    structured_ext: json
    timeout: 120

  - id: crt_linode_ndjson
    name: "crt-sh high volume (Linode)"
    org: Linode
    target: linode.com
    command: /mnt/c/projects/spiderfeet/.tools/pius run --org Linode --domain linode.com --plugins crt-sh --output ndjson
    structured_kind: json
    structured_ext: json
    timeout: 90
    structured_fixture: .seed/scripts/cli_corpus/fixtures/pius_linode_crt_sample.jsonl

  - id: corporate_bbc_gleif_ndjson
    name: "Corporate gleif + wikidata (BBC)"
    org: British Broadcasting Corporation
    target: bbc.co.uk
    command: /mnt/c/projects/spiderfeet/.tools/pius run --org "British Broadcasting Corporation" --domain bbc.co.uk --plugins gleif,wikidata,whois,crt-sh --output ndjson
    structured_kind: json
    structured_ext: json
    timeout: 600

  - id: corporate_squarepeg_ndjson
    name: "Corporate gleif stack (Square Peg Capital)"
    org: Square Peg Capital Pty Ltd
    target: squarepeg.vc
    command: /mnt/c/projects/spiderfeet/.tools/pius run --org "Square Peg Capital Pty Ltd" --domain squarepeg.vc --plugins gleif,wikidata,whois,crt-sh --output ndjson
    jsonl_export: .docs/docs-for-cli-tools/exploration_scratch/pius_corporate_squarepeg.ndjson
    reuse_export: false
    structured_kind: json
    structured_ext: json
    timeout: 600

  - id: corporate_upside_ndjson
    name: "Corporate gleif stack (The Upside)"
    org: The Upside Pty Ltd
    target: theupside.com.au
    command: /mnt/c/projects/spiderfeet/.tools/pius run --org "The Upside Pty Ltd" --domain theupside.com.au --plugins gleif,wikidata,whois,crt-sh --output ndjson
    jsonl_export: .docs/docs-for-cli-tools/exploration_scratch/pius_corporate_upside.ndjson
    reuse_export: false
    structured_kind: json
    structured_ext: json
    timeout: 600

  - id: corporate_k2am_ndjson
    name: "Corporate gleif stack (K2 Asset Management) — harvest deferred"
    org: K2 Asset Management Ltd
    target: k2am.com.au
    command: /mnt/c/projects/spiderfeet/.tools/pius run --org "K2 Asset Management Ltd" --domain www.k2am.com.au --plugins gleif,wikidata,whois,crt-sh --output ndjson
    structured_kind: json
    structured_ext: json
    timeout: 600
    harvest_deferred: true
    harvest_deferred_reason: "Target offline 2026-07-05; run harvest tomorrow when site is reachable"

  - id: corporate_bbc_terminal
    name: "Terminal output (BBC gleif subset)"
    org: British Broadcasting Corporation
    target: bbc.co.uk
    command: /mnt/c/projects/spiderfeet/.tools/pius run --org "British Broadcasting Corporation" --domain bbc.co.uk --plugins gleif,crt-sh --output terminal
    text_from: stdout
    timeout: 180
