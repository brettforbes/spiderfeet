tool: httpx
version: 1
default_runtime: windows
default_timeout: 600
binary_probe: .tools/bin/httpx.exe -version
primary_parser: jsonl
output_path_type: 2

# Host lists derived from subfinder formal examinations (prepare_httpx_hosts_from_subfinder.py).
# Rich web fingerprint pass on subfinder-discovered hostnames.

scenarios:
  - id: from_subfinder_upside_au
    name: "Web probe on subfinder hosts (The Upside .com.au)"
    target: theupside.com.au
    subfinder_scenario: corporate_upside_au_passive_cs
    host_list: .docs/docs-for-cli-tools/exploration_scratch/httpx/hosts/from_subfinder_upside_au_hosts.txt
    probe_profile: "status-code,title,tech-detect,server,cdn,ip"
    command: httpx -l .docs/docs-for-cli-tools/exploration_scratch/httpx/hosts/from_subfinder_upside_au_hosts.txt -status-code -title -tech-detect -server -cdn -ip -json -no-stdin -o .docs/docs-for-cli-tools/exploration_scratch/httpx/exams/from_subfinder_upside_au.jsonl -silent -threads 20 -timeout 15 -rate-limit 40
    jsonl_export: .docs/docs-for-cli-tools/exploration_scratch/httpx/exams/from_subfinder_upside_au.jsonl
    structured_kind: json
    structured_ext: json
    timeout: 900

