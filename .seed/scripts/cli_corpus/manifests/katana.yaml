  - id: from_httpx_upside_com
    name: "Katana crawl on httpx seeds (The Upside .com)"
    target: theupside.com
    httpx_scenario: from_subfinder_upside_com
    url_list: .docs/docs-for-cli-tools/exploration_scratch/katana/urls/from_httpx_upside_com_urls.txt
    crawl_profile: "depth-2,fqdn-scope,concurrency-5,timeout-10,crawl-duration-3m,omit-body"
    command: katana -list .docs/docs-for-cli-tools/exploration_scratch/katana/urls/from_httpx_upside_com_urls.txt -silent -j -duc -ob -or -o .docs/docs-for-cli-tools/exploration_scratch/katana/exams/from_httpx_upside_com.jsonl -depth 2 -c 5 -timeout 10 -fs fqdn -ct 3m -p 3
    jsonl_export: .docs/docs-for-cli-tools/exploration_scratch/katana/exams/from_httpx_upside_com.jsonl
    structured_kind: json
    structured_ext: json
    timeout: 600

  - id: from_httpx_sbs
    name: "Katana crawl on httpx enterprise seeds (SBS)"
    target: sbs.com.au
    httpx_scenario: from_subfinder_sbs
    url_list: .docs/docs-for-cli-tools/exploration_scratch/katana/urls/from_httpx_sbs_urls.txt
    crawl_profile: "depth-1,fqdn-scope,concurrency-8,timeout-15,crawl-duration-10m,max-domain-pages-40"
    command: katana -list .docs/docs-for-cli-tools/exploration_scratch/katana/urls/from_httpx_sbs_urls.txt -silent -j -duc -ob -or -o .docs/docs-for-cli-tools/exploration_scratch/katana/exams/from_httpx_sbs.jsonl -depth 1 -c 8 -timeout 15 -fs fqdn -ct 10m -mdp 40 -rl 30
    jsonl_export: .docs/docs-for-cli-tools/exploration_scratch/katana/exams/from_httpx_sbs.jsonl
    structured_kind: json
    structured_ext: json
    timeout: 1800

  - id: from_httpx_invalid_clean_miss
    name: "Clean miss katana crawl (no httpx seed URLs)"
    target: not-a-real-domain-xyzzy.invalid
    httpx_scenario: from_subfinder_invalid_clean_miss
    url_list: .docs/docs-for-cli-tools/exploration_scratch/katana/urls/from_httpx_invalid_clean_miss_urls.txt
    crawl_profile: "n/a"
    harvest_deferred: true
    harvest_deferred_reason: "httpx examination produced zero live URLs (clean miss)"
    command: katana -list .docs/docs-for-cli-tools/exploration_scratch/katana/urls/from_httpx_invalid_clean_miss_urls.txt -silent -j -duc -ob -or -o .docs/docs-for-cli-tools/exploration_scratch/katana/exams/from_httpx_invalid_clean_miss.jsonl -depth 1 -c 1 -timeout 5
    jsonl_export: .docs/docs-for-cli-tools/exploration_scratch/katana/exams/from_httpx_invalid_clean_miss.jsonl
    structured_kind: json
    structured_ext: json
    timeout: 60
