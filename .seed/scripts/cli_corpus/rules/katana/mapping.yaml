tool: katana
capture_family: structured_native
seed_docs:
  - .seed/scripts/cli_corpus/katana_json_to_graph.py
  - .seed/14_Business_Rules_for_Converting_Structured_Data_to_Graph.md
scan_head:
  data_path: scan_data
  fallback: katana crawl
hooks:
  - apply_katana_records
topology_templates:
  - scan_head
mappings:
  - path: command
    nugget_id: SCAN_CLI
    relation: had
  - path: target
    nugget_id: SCAN_TARGET
    relation: had
  - path: crawl_profile
    nugget_id: SCAN_CRAWL_PROFILE
    relation: had
  - path: url_input_count
    nugget_id: SCAN_URL_INPUT_COUNT
    relation: had
  - path: started_at
    nugget_id: SCAN_START
    relation: had
  - path: duration_s
    nugget_id: SCAN_ELAPSED
    relation: had
  - path: exit_code
    nugget_id: SCAN_EXIT_STATUS
    relation: had
