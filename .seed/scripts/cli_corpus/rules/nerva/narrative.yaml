    This hostname is fronted by a CDN/edge vendor. Origin host count is
    indeterminate — do not treat edge IP cardinality as origin host count.
  origin_fingerprint_suppressed: >
    SOFTWARE_USED nodes tagged ORIGIN_FINGERPRINT_SUPPRESSED are retained for
    audit only and must not be reported as confirmed origin stack.
