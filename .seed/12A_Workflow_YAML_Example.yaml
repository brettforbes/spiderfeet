apiVersion: spiderfeet.workflow/v1
kind: Workflow
id: workflow--1c51e712-b5b5-4ef2-9967-e11debbcc607

info:
  name: Recon Attack Surface
  description: >
    Enumerate domains, map ports/services, and map live web surface + vulns.
    Ports/services chain and web/vuln chain share sfp_cli_subfinder, then fan out.
  author: Modeller
  created: "2026-07-07T21:58:32+10:00"

inputs:
  targets:
    type: string_list
    description: Seed domains to recon
    values:
      - https://example.com

# DAG (not a linear-only list):
#   sfp_cli_subfinder ─┬─► sfp_cli_nmap ─► sfp_cli_nerva
#                   └─► sfp_cli_httpx ─► sfp_cli_katana ─► sfp_cli_nuclei
steps:
  - id: sfp_cli_subfinder
    uses: tool.subfinder
    needs: []
    input:
      type: string_list
      from: $workflow.inputs.targets
      normalize: hostname_from_url
      empty: error
    config:
      # `-dL` (file list) instead of `-d $step.input.values[0]`: the input is a
      # string_list and may carry >1 seed domain. `-d` with values[0] silently
      # drops every seed after the first. `-dL -oJ -cs -o` matches the batch
      # pattern validated in subfinder skill references/tactics.md.
      argv:
        - "-dL"
        - "$step.files.input"
        - "-oJ"
        - "-cs"
        - "-o"
        - "$step.files.output"
        - "-silent"
      files:
        input:
          mode: auto
          format: line_text
        output:
          mode: auto
          format: jsonl
      capture:
        family: structured_native
        adapter: subfinder
    output:
      vars:
        # Ontology reality: subfinder emits DOMAIN_NAME (+ DOMAIN_NAME_PARENT for children).
        # There is no SUBDOMAIN nugget_id in nuggets.json.
        apex_domains:
          type: string_list
          select:
            source: $step.scan_graph
            nodes:
              nugget_id: DOMAIN_NAME
              where:
                - not:
                    related:
                      direction: out
                      relation: had
                      nugget_id: DOMAIN_NAME_PARENT
            project: nugget_data
            distinct: true
        subdomains:
          type: string_list
          select:
            source: $step.scan_graph
            nodes:
              nugget_id: DOMAIN_NAME
              where:
                - related:
                    direction: out
                    relation: had
                    nugget_id: DOMAIN_NAME_PARENT
            project: nugget_data
            distinct: true
        all_domains:
          type: string_list
          union:
            - $step.vars.apex_domains
            - $step.vars.subdomains
            - $workflow.inputs.targets
          distinct: true
    context:
      export: scan_graph

  - id: sfp_cli_nmap
    uses: tool.nmap
    needs: [sfp_cli_subfinder]
    input:
      type: string_list
      from: $steps.sfp_cli_subfinder.vars.all_domains
      empty: error
    config:
      # `-Pn`: our own evasion-and-tactics.md lists ICMP-blocked hosts as the
      # #1 real-world symptom (status state="down" for a known-live IP) —
      # expected often here since `all_domains` are internet-facing/CDN'd and
      # this step has no adaptive retry. `--top-ports 100` + 900s timeout:
      # multi-host subdomain lists from subfinder cannot finish top-ports 1000
      # inside the old 120s wall clock (live SBS: timeout after 120s).
      timeout: 900
      argv:
        - "-sT"
        - "-T3"
        - "-Pn"
        - "--top-ports"
        - "100"
        - "--open"
        - "-iL"
        - "$step.files.input"
        - "-oX"
        - "$step.files.output"
      files:
        input:
          mode: auto
          format: line_text
        output:
          mode: auto
          format: xml
      capture:
        family: structured_native
        adapter: nmap
    output:
      vars:
        # Cascade: for each endpoint, cartesian IP × PORT under that endpoint.
        ip_port_list:
          type: string_list
          select:
            source: $step.scan_graph
            for_each:
              as: endpoint
              nodes:
                nugget_id_in: [HOST, SYSTEM, DEVICE, CDN, SERVER]
              collect:
                - as: ip
                  reachable_from: endpoint
                  along:
                    relation: contains
                    transitive: true
                  nodes:
                    # IP classification (SPEC-005 Epic AH) emits IPV4_ADDRESS /
                    # IPV6_ADDRESS — never the ambiguous IP_ADDRESS. The old
                    # IP_ADDRESS id matched nothing, so ip×port collapsed to []
                    # and nerva was skipped for empty input.
                    nugget_id_in: [IPV4_ADDRESS, IPV6_ADDRESS]
                  project: nugget_data
                - as: port
                  reachable_from: endpoint
                  along:
                    relation: contains
                    transitive: true
                  nodes:
                    nugget_id_in: [PORT, TCP_PORT_OPEN]
                    where:
                      - related:
                          direction: in
                          relation: contains
                          transitive: true
                          nugget_id: TRANSPORT
                  project: nugget_data
              emit:
                product: [ip, port]
                join: ":"
            distinct: true
    context:
      export: scan_graph

  - id: sfp_cli_nerva
    uses: tool.nerva
    needs: [sfp_cli_nmap]
    input:
      type: string_list
      from: $steps.sfp_cli_nmap.vars.ip_port_list
      empty: skip_step
    config:
      # Module default is 120s; multi-host ip:port lists from nmap need more.
      timeout: 300
      # Nerva has no `-iL` flag (that is nmap's) — its list flag is `-l` /
      # `--list` (Nerva-CLI-Options.md, nerva skill cli-options.md). Every
      # real harvested nerva command in app_examination_docs/nerva/ uses
      # `-t`/`--list`, never `-iL`. Also add `--output` so the run actually
      # writes to `$step.files.output` (files.output.mode: auto expects the
      # tool to be told the path, same as every other step in this workflow).
      argv:
        - "--json"
        - "--list"
        - "$step.files.input"
        - "--output"
        - "$step.files.output"
      files:
        input:
          mode: auto
          format: line_text
        output:
          mode: auto
          format: jsonl
      capture:
        family: structured_native
        adapter: nerva
    context:
      export: scan_graph

  - id: sfp_cli_httpx
    uses: tool.httpx
    needs: [sfp_cli_subfinder]
    input:
      type: string_list
      from: $steps.sfp_cli_subfinder.vars.all_domains
      empty: error
    config:
      argv:
        - "-l"
        - "$step.files.input"
        - "-status-code"
        - "-title"
        - "-tech-detect"
        - "-server"
        - "-cdn"
        - "-ip"
        - "-json"
        - "-no-stdin"
        - "-o"
        - "$step.files.output"
        - "-silent"
        - "-threads"
        - "10"
        - "-timeout"
        - "15"
        - "-rate-limit"
        - "25"
      files:
        input:
          mode: auto
          format: line_text
        output:
          mode: auto
          format: jsonl
      capture:
        family: structured_native
        adapter: httpx
    output:
      vars:
        # Live web hosts feeding katana. The httpx adapter attaches probed
        # DOMAIN_NAME nodes to the SCAN_RECORD head (and CNAME targets under
        # their parent DOMAIN_NAME) — they are NOT contained by HOST/CDN, which
        # only carry CDN_NAME/CDN_TYPE descriptors. The previous
        # HOST/CDN --contains--> DOMAIN_NAME walk matched nothing, so katana was
        # skipped. A plain DOMAIN_NAME projection is the correct "just a list of
        # hosts" selector for this graph shape.
        live_hosts:
          type: string_list
          select:
            source: $step.scan_graph
            nodes:
              nugget_id: DOMAIN_NAME
            project: nugget_data
            distinct: true
    # Interim — do not export to context
    context:
      export: none

  - id: sfp_cli_katana
    uses: tool.katana
    needs: [sfp_cli_httpx]
    input:
      type: string_list
      from: $steps.sfp_cli_httpx.vars.live_hosts
      empty: skip_step
    config:
      # Module default is 90s; argv also sets tool `-ct 8m`, so wall clock
      # must cover the crawl duration (plus overhead).
      timeout: 600
      argv:
        - "-list"
        - "$step.files.input"
        - "-j"
        - "-duc"
        - "-ob"
        - "-or"
        - "-o"
        - "$step.files.output"
        - "-depth"
        - "2"
        - "-c"
        - "5"
        - "-timeout"
        - "10"
        - "-fs"
        - "fqdn"
        - "-ct"
        - "8m"
      files:
        input:
          mode: auto
          format: line_text
        output:
          mode: auto
          format: jsonl
      capture:
        family: structured_native
        adapter: katana
    output:
      vars:
        # URL/LINK nuggets only — do not union DOMAIN_NAME into Nuclei -l (R19-09).
        crawl_urls:
          type: string_list
          select:
            source: $step.scan_graph
            nodes:
              nugget_id_in:
                - LINKED_URL_INTERNAL
                - LINKED_URL_EXTERNAL
            project: nugget_data
            distinct: true
    context:
      export: none

  - id: sfp_cli_nuclei
    uses: tool.nuclei
    needs: [sfp_cli_katana]
    input:
      type: string_list
      from: $steps.sfp_cli_katana.vars.crawl_urls
      empty: skip_step
    config:
      # Per-batch wall clock (R19-08); step cap via overall_timeout below.
      timeout: 300
      overall_timeout: 3600
      # Dropped `-tags cve`: our own strategic exploration matrix
      # (exploration_scratch/nuclei/strategic/exploration_report.json) ran
      # `-tags cve -severity medium,high,critical` against 4 real targets
      # (scanme.sh, k2am, vco_fund, squarepeg) and got 0 records every single
      # time, while the untagged exposures-path pass on the same hosts found
      # 25-34 records each. A CVE-tag-only pass is not a realistic way to
      # maximize returns for this workflow's typical target class; run the
      # full template tree (minus the excluded etags, matching the base
      # nuclei skill's default SpiderFeet-equivalent command) instead so
      # tech/exposure/misconfig/panel/CVE findings all surface in one pass.
      argv:
        - "-l"
        - "$step.files.input"
        - "-silent"
        - "-jsonl"
        - "-omit-raw"
        - "-omit-template"
        - "-no-interactsh"
        - "-etags"
        - "dos,fuzz,misc"
        - "-duc"
        - "-retries"
        - "1"
        - "-c"
        - "25"
        - "-timeout"
        - "15"
        - "-jle"
        - "$step.files.output"
      files:
        input:
          mode: auto
          format: line_text
        output:
          mode: auto
          format: jsonl
      capture:
        family: structured_native
        adapter: nuclei
    context:
      export: scan_graph
