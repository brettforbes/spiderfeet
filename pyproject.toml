[tool.poetry]
name = "spiderFeet"
version = "0.1.0"
description = "Open source intelligence (OSINT) automation tool"
authors = ["BrettForbes <brett@cloudaccelerator.co>"]
license = "Apache-2.0"
readme = "README.md"
packages = [{ include = "spiderfeet" }]

[tool.poetry.dependencies]
python = ">=3.8,<4.0"
adblockparser = ">=0.7,<1"
dnspython = ">=2.3.0,<3"
exifread = ">=2.3.2,<3"
cherrypy = ">=18.8.0,<19"
cherrypy-cors = ">=1.6,<2"
mako = ">=1.2.4,<2"
beautifulsoup4 = ">=4.11.2,<5"
lxml = ">=4.9.2,<5"
netaddr = ">=0.8.0,<1"
pysocks = ">=1.7.1,<2"
requests = ">=2.28.2,<3"
ipwhois = ">=1.1.0,<1.2.0"
ipaddr = ">=2.2.0,<3"
phonenumbers = ">=8.13.6,<9"
pygexf = ">=0.2.2,<0.3"
pypdf2 = ">=1.28.6,<2"
python-whois = ">=0.7.3,<0.8"
secure = ">=0.3.0,<0.4.0"
pyopenssl = ">=21.0.0,<22"
python-docx = ">=0.8.11,<0.9"
python-pptx = ">=0.6.21,<0.7"
networkx = ">=2.6.3,<2.7"
cryptography = ">=3.4.8,<4"
publicsuffixlist = ">=0.9.3,<0.10"
openpyxl = ">=3.1.1,<4"
pyyaml = ">=6.0.0,<7"
fastapi = ">=0.115.0,<1"
uvicorn = { version = ">=0.32.0,<1", extras = ["standard"] }
typedb-driver = "^3.11.0"


[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<9"
httpx = ">=0.27.0,<1"
ntc-templates = ">=7.0.0,<8"
textfsm = ">=1.1.3,<2"


[tool.pytest.ini_options]
markers = [
    "slow: integration tests that run a real OSINT scan (seconds)",
    "typedb: integration tests that require a running TypeDB server",
]
filterwarnings = [
    "ignore::DeprecationWarning:spiderfeet.api.app",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
