<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>SpiderFeet — dark mode logo</title>
  <desc>SpiderFeet OSINT intelligence logo, dark mode. Light slate spider on a deep navy geometric web with orange eye and foot accents and cyan data nodes.</desc>

  <rect width="400" height="400" fill="#0a0f1e"/>

  <g transform="translate(200,190)">
    <!-- web spokes -->
    <line x1="0" y1="0" x2="0"    y2="-115" stroke="#1e3a5f" stroke-width="0.8"/>
    <line x1="0" y1="0" x2="81"   y2="-81"  stroke="#1e3a5f" stroke-width="0.8"/>
    <line x1="0" y1="0" x2="115"  y2="0"    stroke="#1e3a5f" stroke-width="0.8"/>
    <line x1="0" y1="0" x2="81"   y2="81"   stroke="#1e3a5f" stroke-width="0.8"/>
    <line x1="0" y1="0" x2="0"    y2="115"  stroke="#1e3a5f" stroke-width="0.8"/>
    <line x1="0" y1="0" x2="-81"  y2="81"   stroke="#1e3a5f" stroke-width="0.8"/>
    <line x1="0" y1="0" x2="-115" y2="0"    stroke="#1e3a5f" stroke-width="0.8"/>
    <line x1="0" y1="0" x2="-81"  y2="-81"  stroke="#1e3a5f" stroke-width="0.8"/>
    <!-- web rings -->
    <polygon points="0,-32 23,-23 32,0 23,23 0,32 -23,23 -32,0 -23,-23" fill="none" stroke="#164e63" stroke-width="0.8" opacity="0.9"/>
    <polygon points="0,-62 44,-44 62,0 44,44 0,62 -44,44 -62,0 -44,-44" fill="none" stroke="#164e63" stroke-width="0.8" opacity="0.7"/>
    <polygon points="0,-90 64,-64 90,0 64,64 0,90 -64,64 -90,0 -64,-64" fill="none" stroke="#164e63" stroke-width="0.8" opacity="0.5"/>
    <polygon points="0,-115 81,-81 115,0 81,81 0,115 -81,81 -115,0 -81,-81" fill="none" stroke="#164e63" stroke-width="0.8" opacity="0.35"/>
    <!-- outer web nodes cyan -->
    <circle cx="0"    cy="-115" r="5" fill="#06b6d4"/>
    <circle cx="81"   cy="-81"  r="5" fill="#06b6d4"/>
    <circle cx="115"  cy="0"    r="5" fill="#06b6d4"/>
    <circle cx="81"   cy="81"   r="5" fill="#06b6d4"/>
    <circle cx="0"    cy="115"  r="5" fill="#06b6d4"/>
    <circle cx="-81"  cy="81"   r="5" fill="#06b6d4"/>
    <circle cx="-115" cy="0"    r="5" fill="#06b6d4"/>
    <circle cx="-81"  cy="-81"  r="5" fill="#06b6d4"/>
    <!-- mid ring nodes -->
    <circle cx="0"   cy="-62" r="3.5" fill="#22d3ee" opacity="0.7"/>
    <circle cx="44"  cy="-44" r="3.5" fill="#22d3ee" opacity="0.7"/>
    <circle cx="62"  cy="0"   r="3.5" fill="#22d3ee" opacity="0.7"/>
    <circle cx="44"  cy="44"  r="3.5" fill="#22d3ee" opacity="0.7"/>
    <circle cx="0"   cy="62"  r="3.5" fill="#22d3ee" opacity="0.7"/>
    <circle cx="-44" cy="44"  r="3.5" fill="#22d3ee" opacity="0.7"/>
    <circle cx="-62" cy="0"   r="3.5" fill="#22d3ee" opacity="0.7"/>
    <circle cx="-44" cy="-44" r="3.5" fill="#22d3ee" opacity="0.7"/>
    <!-- legs -->
    <polyline points="-11,-14  -38,-40  -72,-22"  fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="-13,-6   -44,-18  -80,-8"   fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="-13,6    -44,22   -78,40"   fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="-11,18   -34,48   -60,68"   fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="11,-14   38,-40   72,-22"   fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="13,-6    44,-18   80,-8"    fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="13,6     44,22    78,40"    fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="11,18    34,48    60,68"    fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- foot tips orange -->
    <circle cx="-72" cy="-22" r="3.5" fill="#f97316"/>
    <circle cx="-80" cy="-8"  r="3.5" fill="#f97316"/>
    <circle cx="-78" cy="40"  r="3.5" fill="#f97316"/>
    <circle cx="-60" cy="68"  r="3.5" fill="#f97316"/>
    <circle cx="72"  cy="-22" r="3.5" fill="#f97316"/>
    <circle cx="80"  cy="-8"  r="3.5" fill="#f97316"/>
    <circle cx="78"  cy="40"  r="3.5" fill="#f97316"/>
    <circle cx="60"  cy="68"  r="3.5" fill="#f97316"/>
    <!-- abdomen -->
    <polygon points="0,-5 14,8 10,32 0,40 -10,32 -14,8" fill="#cbd5e1"/>
    <line x1="0" y1="2" x2="0" y2="34" stroke="#94a3b8" stroke-width="1" opacity="0.5"/>
    <polyline points="-8,14 0,10 8,14" fill="none" stroke="#64748b" stroke-width="1" opacity="0.7"/>
    <polyline points="-7,22 0,18 7,22" fill="none" stroke="#64748b" stroke-width="1" opacity="0.5"/>
    <!-- cephalothorax -->
    <polygon points="0,-22 12,-16 14,-4 8,6 -8,6 -14,-4 -12,-16" fill="#e2e8f0"/>
    <line x1="0" y1="-20" x2="0" y2="4" stroke="#94a3b8" stroke-width="0.8" opacity="0.5"/>
    <!-- pedipalps -->
    <polyline points="-6,-20 -14,-30 -10,-36" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="6,-20  14,-30  10,-36"  fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- fangs -->
    <polygon points="-5,-21 -9,-32 -6,-38 -4,-30" fill="#cbd5e1"/>
    <polygon points="5,-21  9,-32  6,-38  4,-30"  fill="#cbd5e1"/>
    <!-- eyes orange -->
    <circle cx="-5"   cy="-16" r="3.5" fill="#f97316"/>
    <circle cx="5"    cy="-16" r="3.5" fill="#f97316"/>
    <circle cx="-10"  cy="-12" r="2"   fill="#fb923c" opacity="0.85"/>
    <circle cx="10"   cy="-12" r="2"   fill="#fb923c" opacity="0.85"/>
    <circle cx="-4.5" cy="-17" r="1"   fill="white" opacity="0.7"/>
    <circle cx="5.5"  cy="-17" r="1"   fill="white" opacity="0.7"/>
  </g>

  <!-- wordmark -->
  <text x="200" y="334" font-family="monospace" font-size="28" font-weight="500" fill="#e2e8f0" text-anchor="middle">Spider<tspan fill="#06b6d4">Feet</tspan></text>
  <text x="200" y="354" font-family="sans-serif" font-size="9" font-weight="400" fill="#334155" letter-spacing="2.5" text-anchor="middle">OSINT INTELLIGENCE</text>
</svg>
